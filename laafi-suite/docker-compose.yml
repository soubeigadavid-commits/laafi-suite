services:
  db:
    image: postgres:16-alpine
    container_name: laafi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laafi
    ports:
      - "5432:5432"
    volumes:
      - laafi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laafi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  laafi-pgdata:
